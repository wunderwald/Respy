<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
  <title>EEG Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <div id="main">
      <div id="view-pane">
        <div id="empty-state">Open a CSV file to begin</div>
      </div>
      <div id="filter-pane">
        <canvas id="butterfly-canvas"></canvas>
      </div>
    </div>

    <div id="sidebar">
      <div id="sidebar-header">
        <button id="file-btn">Open EEG CSV</button>
        <div id="file-name"></div>
        <button id="marker-btn" disabled>Load Marker CSV</button>
        <div id="marker-info"></div>
      </div>
      <div id="channel-list-header">
        <span>Channels</span>
        <div id="channel-toggles">
          <span id="all-btn">all</span>
          <span id="none-btn">none</span>
        </div>
      </div>
      <div id="channel-list"></div>
    </div>

  </div>
  <script src="renderer.js"></script>
</body>
</html>
